name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      version_name:
        description: Android version name
        required: false
        default: "3.0.0"
        type: string
      version_code:
        description: Android version code
        required: false
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
      CAPACITOR_REQUIRE_REMOTE: "1"
      CAPACITOR_RELEASE: ${{ inputs.build_type == 'release' && '1' || '0' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "tools platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Validate public HTTPS backend
        run: npm run android:validate

      - name: Typecheck application
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify native remote configuration
        run: |
          node -e "const c=require('./android/app/src/main/assets/capacitor.config.json'); if(!c.server || !c.server.url || !c.server.url.startsWith('https://')) { console.error('Native config does not contain a public HTTPS server URL'); process.exit(1); } console.log('Native remote URL:', new URL(c.server.url).host);"

      - name: Prepare release signing
        if: inputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for a signed release build."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required for a signed release build."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathsphere-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mathsphere-release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: inputs.build_type == 'debug'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: inputs.build_type == 'release'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload debug APK
        if: inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: mathsphere-ai-debug-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: inputs.build_type == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: mathsphere-ai-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
