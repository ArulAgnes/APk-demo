name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "Application build mode"
        required: true
        default: "offline"
        type: choice
        options:
          - offline
          - online
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_name:
        description: "Android version name"
        required: false
        default: "3.0.0"
        type: string
      version_code:
        description: "Android version code"
        required: false
        default: "1"
        type: string
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.build_mode || 'offline' }} ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BUILD_MODE: ${{ inputs.build_mode || 'offline' }}
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      CAPACITOR_SERVER_URL: ${{ inputs.build_mode == 'online' && vars.CAPACITOR_SERVER_URL || '' }}
      CAPACITOR_REQUIRE_REMOTE: ${{ inputs.build_mode == 'online' && '1' || '0' }}
      CAPACITOR_RELEASE: ${{ inputs.build_type == 'release' && '1' || '0' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '3.0.0' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '1' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Run offline sync & idempotency tests
        run: npm run test:offline-sync

      - name: Run mathematical engine verification (107 tests)
        run: npx tsx -e "import { runSuite } from './src/lib/tests'; const s = runSuite(); console.log('Passed:', s.passed, 'Failed:', s.failed); if (s.failed > 0) process.exit(1);"

      - name: Typecheck application
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

      - name: Build Android offline bundle
        run: npm run build:android-web

      - name: Validate Android configuration
        run: npm run android:validate

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Verify native configuration
        run: |
          node -e "
            const fs = require('fs');
            const c = require('./android/app/src/main/assets/capacitor.config.json');
            const mode = process.env.BUILD_MODE;
            console.log('Verifying native assets for mode:', mode);
            if (mode === 'online') {
              if (!c.server || !c.server.url || !c.server.url.startsWith('https://')) {
                console.error('ERROR: Online build requires a valid HTTPS server.url');
                process.exit(1);
              }
              console.log('Online server URL verified:', new URL(c.server.url).host);
            } else {
              if (c.server && c.server.url) {
                console.error('ERROR: Offline build must not define a remote server.url');
                process.exit(1);
              }
              const assetIndex = './android/app/src/main/assets/public/index.html';
              const assetBundle = './android/app/src/main/assets/public/bundle.js';
              if (!fs.existsSync(assetIndex) || !fs.existsSync(assetBundle)) {
                console.error('ERROR: Missing offline assets in android/app/src/main/assets/public');
                process.exit(1);
              }
              console.log('Offline standalone assets verified successfully in APK assets');
            }
          "

      - name: Prepare release signing
        if: (inputs.build_type || 'debug') == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is required for a signed release build."
            exit 1
          fi
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are required for a signed release build."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathsphere-release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mathsphere-release.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: (inputs.build_type || 'debug') == 'debug'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        if: (inputs.build_type || 'debug') == 'release'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Compute APK checksums and metadata
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "::error::No APK file found in build outputs."
            exit 1
          fi
          FILE_SIZE=$(du -h "$APK_PATH" | cut -f1)
          SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"
          echo "APK_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "### MathSphere AI APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode:** ${{ env.BUILD_MODE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** ${{ env.BUILD_TYPE }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.arulagnes.mathsphereai\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ env.ANDROID_VERSION_NAME }} (code ${{ env.ANDROID_VERSION_CODE }})" >> $GITHUB_STEP_SUMMARY
          echo "- **APK File:** \`$(basename $APK_PATH)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size:** $FILE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256 Checksum:** \`$SHA256\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload debug APK
        if: (inputs.build_type || 'debug') == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: MathSphere-AI-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: (inputs.build_type || 'debug') == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: MathSphere-AI-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
